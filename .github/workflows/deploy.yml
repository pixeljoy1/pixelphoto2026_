name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/pixelphoto2026-repo-setup-mo84c6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Draft mode: auto-marks EXPORTED rows as ON_SITE=Y, drops any Y
      # violation of README §4.4 with a warning instead of failing, and
      # downgrades missing ALT_TEXT to a warning. Flip to 'false' for
      # a strict release build.
      DRAFT_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build library JSON from CSV (if present)
        run: npm run library:build
      - name: Build site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
